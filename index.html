#splash .sp-word{font-family:"Fredoka","Trebuchet MS",sans-serif;font-weight:700;font-size:44px;line-height:1;color:#fff6e4;text-shadow:3px 3px 0 #26282c}

<style>:root {
  --bg: #f3ecdf;
  --surface: #fffaf1;
  --surface-2: #ede3cf;
  --ink: #1d2a23;
  --ink-2: #4d5b52;
  --line: #d8cab0;
  --felt: #1e5a42;
  --felt-2: #174a36;
  --felt-deep: #0f3526;
  --on-felt: #f7f1e3;
  --on-felt-2: #cfe0d4;
  --brass: #8a5a12;
  --brass-soft: #f1e2bf;
  --danger: #a12f28;
  --good: #26663a;
  --shadow: 0 1px 2px rgba(40, 30, 10, .08), 0 6px 18px rgba(40, 30, 10, .08);
  --radius: 16px;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1c16; --surface: #142820; --surface-2: #1b3429; --ink: #f2ebd9; --ink-2: #bcb5a1;
    --line: #2b4538; --felt: #1c5840; --felt-2: #164733; --felt-deep: #0a1a13; --on-felt: #f7f1e3; --on-felt-2: #b9d2c3;
    --brass: #dcb86c; --brass-soft: #3a3120; --danger: #f08a7e; --good: #8fd3a0;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1c16; --surface: #142820; --surface-2: #1b3429; --ink: #f2ebd9; --ink-2: #bcb5a1;
  --line: #2b4538; --felt: #1c5840; --felt-2: #164733; --felt-deep: #0a1a13; --on-felt: #f7f1e3; --on-felt-2: #b9d2c3;
  --brass: #dcb86c; --brass-soft: #3a3120; --danger: #f08a7e; --good: #8fd3a0;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums lining-nums; }

.app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.wrap { width: 100%; max-width: 760px; margin-left: auto; margin-right: auto; padding-left: 16px; padding-right: 16px; }

/* Felt header band */
.felt {
  background-color: var(--felt);
  background-image:
    radial-gradient(120% 140% at 50% -20%, rgba(255, 255, 255, .10), rgba(255, 255, 255, 0) 60%),
    radial-gradient(rgba(0, 0, 0, .06) 1px, transparent 1.2px);
  background-size: 100% 100%, 5px 5px;
  color: var(--on-felt);
}
.topbar { padding-top: env(safe-area-inset-top); position: sticky; top: 0; z-index: 20; box-shadow: 0 1px 0 rgba(0, 0, 0, .15); }
.topbar .row { display: flex; align-items: center; gap: 8px; min-height: 60px; }
.topbar h1 { font-family: var(--serif); font-weight: 600; font-size: 21px; margin: 0; flex: 1; letter-spacing: .2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn {
  width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: inherit;
  display: inline-grid; place-items: center; flex: none;
}
.iconbtn:hover { background: rgba(255, 255, 255, .10); }
.iconbtn svg { width: 24px; height: 24px; }
.brassline { height: 3px; background: linear-gradient(90deg, transparent, var(--brass), transparent); opacity: .7; }

main { flex: 1; padding: 16px 0 calc(28px + env(safe-area-inset-bottom)); }
h2.sec { font-family: var(--serif); font-size: 19px; font-weight: 600; margin: 22px 0 10px; }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.pad { padding: 16px; }
.stack > * + * { margin-top: 12px; }

.btn {
  min-height: 48px; padding: 0 20px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.primary { background: var(--felt); border-color: var(--felt-2); color: var(--on-felt); box-shadow: 0 2px 0 var(--felt-deep); }
.btn.primary:active { transform: translateY(1px); box-shadow: none; }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.big { min-height: 56px; font-size: 18px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
.btnrow > .btn { flex: 1 1 140px; }

/* Home */
.hero { padding-top: 22px; padding-bottom: 26px; }
.hero .brand { font-family: var(--serif); font-size: 34px; font-weight: 600; margin: 0; letter-spacing: .3px; }
.hero .tag { margin: 4px 0 0; color: var(--on-felt-2); }
.gamegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (min-width: 620px) { .gamegrid { grid-template-columns: 1fr 1fr 1fr; } }
.gametile {
  text-align: left; padding: 14px; min-height: 124px; display: flex; flex-direction: column; gap: 6px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
}
.gametile:hover { border-color: var(--brass); }
.gametile .gi { width: 40px; height: 40px; border-radius: 10px; background: var(--felt); color: var(--on-felt); display: grid; place-items: center; }
.gametile .gi svg { width: 24px; height: 24px; }
.gametile b { font-family: var(--serif); font-size: 18px; font-weight: 600; }
.gametile span { font-size: 13.5px; color: var(--ink-2); line-height: 1.35; }
.resume { display: flex; align-items: center; gap: 12px; padding: 14px 16px; width: 100%; text-align: left; }
.resume .grow { flex: 1; min-width: 0; }

/* Setup */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; font-size: 14px; }
.textin {
  min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px; width: 100%;
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15px;
}
.chip[aria-pressed="true"] { background: var(--felt); color: var(--on-felt); border-color: var(--felt-2); }
.sidecard { padding: 12px; border-left: 6px solid var(--c, var(--line)); }
.sidecard .members { display: grid; gap: 8px; margin-top: 8px; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.swatch { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink); }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.opt:first-child { border-top: 0; }
.opt .t { font-weight: 600; }
.opt .h { font-size: 13.5px; color: var(--ink-2); }
select.textin { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%); background-position: calc(100% - 20px) 21px, calc(100% - 14px) 21px; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px; }

.switch { width: 56px; height: 34px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); position: relative; flex: none; padding: 0; min-height: 44px; display: inline-flex; align-items: center; }
.switch::after { content: ""; position: absolute; top: 50%; left: 4px; width: 26px; height: 26px; margin-top: -13px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: left .15s; }
.switch[aria-checked="true"] { background: var(--felt); border-color: var(--felt-2); }
.switch[aria-checked="true"]::after { left: 26px; }

/* Scoreboard */
.status { font-size: 14.5px; color: var(--ink-2); margin: 0 0 12px; }
.totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tot { position: relative; padding: 12px 14px 14px; border-top: 5px solid var(--c); }
.tot .nm { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tot .mb { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tot .big { font-family: var(--serif); font-size: 44px; line-height: 1.05; font-weight: 600; margin-top: 6px; }
.tot .ex { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.tot.lead { border-color: var(--brass); box-shadow: 0 0 0 2px var(--brass), var(--shadow); }
.leadtag { position: absolute; top: 10px; right: 10px; font-size: 11.5px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--brass); background: var(--brass-soft); padding: 2px 8px; border-radius: 999px; }
.progress { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 8px; }
.progress > i { display: block; height: 100%; background: var(--c, var(--brass)); }

.hist { width: 100%; border-collapse: separate; border-spacing: 0; }
.hist th, .hist td { padding: 0 6px; height: 48px; text-align: right; border-bottom: 1px solid var(--line); }
.hist th { font-size: 12.5px; color: var(--ink-2); font-weight: 600; height: 40px; }
.hist th:first-child, .hist td:first-child { text-align: left; padding-left: 12px; }
.hist td:last-child, .hist th:last-child { padding-right: 12px; }
.hist tbody tr { cursor: pointer; }
.hist tbody tr:hover td { background: var(--surface-2); }
.hist .neg { color: var(--danger); }
.hist .cum { display: block; font-size: 12px; color: var(--ink-2); line-height: 1.1; }
.histscroll { overflow-x: auto; }

/* Entry */
.sidetabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.sidetab { flex: 1 0 auto; min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); padding: 6px 14px; text-align: left; border-bottom: 4px solid var(--c); }
.sidetab[aria-pressed="true"] { background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--ink); }
.sidetab small { display: block; font-size: 12px; color: var(--ink-2); }
.sidetab b { font-size: 18px; }
.group { padding: 4px 16px 8px; }
.group h3 { font-family: var(--serif); font-size: 17px; font-weight: 600; margin: 12px 0 2px; }
.stepper { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); min-height: 60px; }
.group h3 + .stepper, .stepper.first { border-top: 0; }
.stepper .lbl { flex: 1; min-width: 0; }
.stepper .lbl b { display: block; font-weight: 600; }
.stepper .lbl small { color: var(--ink-2); font-size: 13px; }
.stepper .ctl { display: flex; align-items: center; gap: 6px; }
.stepper .ctl button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-size: 22px; font-weight: 600; line-height: 1; display: grid; place-items: center; }
.stepper .ctl input { width: 64px; height: 44px; text-align: center; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stepper .ctl .val { min-width: 48px; text-align: center; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.preview { position: sticky; bottom: 0; z-index: 10; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 75%, transparent); }
.preview .inner { display: flex; gap: 10px; align-items: center; }
.previewscores { flex: 1; display: flex; gap: 12px; overflow-x: auto; font-size: 14px; }
.previewscores span { white-space: nowrap; }
.previewscores b { font-size: 18px; font-variant-numeric: tabular-nums; }
.warn { background: var(--brass-soft); color: var(--ink); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { flex: 1 0 auto; min-height: 48px; min-width: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; padding: 0 12px; }
.seg button[aria-pressed="true"] { background: var(--felt); color: var(--on-felt); border-color: var(--felt-2); }
.linkbtn { background: none; border: 0; color: var(--brass); font-weight: 700; min-height: 44px; padding: 0 4px; text-decoration: underline; text-underline-offset: 3px; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(8, 16, 12, .55); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); color: var(--ink); width: 100%; max-width: 640px; max-height: 88vh; overflow: auto; border-radius: 22px 22px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 40px rgba(0, 0, 0, .3); }
@media (min-width: 700px) { .scrim { align-items: center; } .sheet { border-radius: 22px; } }
.sheet .grab { width: 44px; height: 5px; border-radius: 9px; background: var(--line); margin: 6px auto 8px; }
.sheet h2 { font-family: var(--serif); font-size: 22px; margin: 4px 0 8px; display: flex; align-items: center; gap: 8px; }
.sheet h2 span { flex: 1; }
.rules li { margin: 0 0 10px; }

/* Tally pad */
.tally { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 8px; }
.tally button { min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 700; font-size: 17px; }
.tally button small { display: block; font-size: 11px; font-weight: 600; color: var(--ink-2); }
.tallylist { min-height: 32px; display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.tallylist span { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tallytotal { font-family: var(--serif); font-size: 34px; font-weight: 600; }

/* Cribbage */
.board { padding: 14px 12px; border-radius: 18px; background: linear-gradient(160deg, #b98a52, #8f6435); border: 1px solid #6f4a23; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), var(--shadow); }
.board svg { width: 100%; height: auto; display: block; }
.pegrow { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 8px; }
.pegrow button { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 800; font-size: 18px; border-bottom: 3px solid var(--c); }
.cardpick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cardpick button { min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 800; font-size: 16px; }
.suitpick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
.suitpick button { min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 26px; }
.suitpick button[aria-pressed="true"], .cardpick button[aria-pressed="true"] { background: var(--felt); color: var(--on-felt); }
.redsuit { color: #b3261e; }
:root[data-theme="dark"] .redsuit { color: #ff8f86; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .redsuit { color: #ff8f86; } }
.playcards { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.pc { width: 54px; height: 76px; border-radius: 8px; background: #fffdf8; color: #1d2a23; border: 1px solid #cdbf9f; display: grid; place-items: center; font-weight: 800; font-size: 18px; box-shadow: 0 2px 4px rgba(0, 0, 0, .15); position: relative; }
.pc.empty { background: transparent; border: 2px dashed var(--line); box-shadow: none; color: var(--ink-2); font-size: 13px; font-weight: 600; }
.pc.sel { outline: 3px solid var(--brass); }
.pc .st { position: absolute; top: -8px; right: -6px; font-size: 10px; background: var(--brass); color: #fff; padding: 1px 5px; border-radius: 6px; }
.pc .r { color: #b3261e; }

/* Game over */
.winner { text-align: center; padding-top: 28px; padding-bottom: 22px; }
.winner .lbl { text-transform: uppercase; letter-spacing: 2px; font-size: 13px; color: var(--on-felt-2); font-weight: 700; }
.winner .who { font-family: var(--serif); font-size: 38px; font-weight: 600; margin: 6px 0 4px; }
.laurel { display: block; width: 140px; height: 22px; margin: 0 auto 10px; color: #dcb86c; }
.final { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-left: 6px solid var(--c); }
.final .n { flex: 1; font-weight: 700; }
.final .s { font-family: var(--serif); font-size: 28px; font-weight: 600; }

.foot { text-align: center; font-size: 13px; color: var(--ink-2); padding: 22px 0 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Look C: Retro Rec Room. Theme layer only; appended after the base theme.css. */
:root {
  --bg: #f4ead3; --surface: #fffaf0; --surface-2: #f5e8cb; --ink: #25272b; --ink-2: #55545a; --line: #dcc9a2;
  --felt: #145c60; --felt-2: #0f4a4d; --felt-deep: #26282c; --on-felt: #fff6e4; --on-felt-2: #ffdf9e;
  --brass: #b3391b; --brass-soft: #ffe1c9; --danger: #a8301f; --good: #2b6a3c;
  --outline: #26282c; --mustard: #e9a82b; --tomato: #de5434; --radius: 16px;
  --shadow: 3px 3px 0 var(--outline);
  --serif: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --sans: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #162325; --surface: #1f2f31; --surface-2: #29393b; --ink: #f7eedb; --ink-2: #c6c0b2; --line: #3a4d4f;
    --felt: #145c60; --felt-2: #0f4a4d; --felt-deep: #081d1e; --on-felt: #fff6e4; --on-felt-2: #ffdf9e;
    --brass: #ffae80; --brass-soft: #43302a; --danger: #ff9b87; --good: #8fd6a3; --outline: #081314;
  }
}
:root[data-theme="dark"] {
  --bg: #162325; --surface: #1f2f31; --surface-2: #29393b; --ink: #f7eedb; --ink-2: #c6c0b2; --line: #3a4d4f;
  --felt: #145c60; --felt-2: #0f4a4d; --felt-deep: #081d1e; --on-felt: #fff6e4; --on-felt-2: #ffdf9e;
  --brass: #ffae80; --brass-soft: #43302a; --danger: #ff9b87; --good: #8fd6a3; --outline: #081314;
}
body { background: radial-gradient(rgba(38, 40, 44, .075) 1.3px, transparent 1.7px) 0 0 / 14px 14px, var(--bg); }

/* Topbar: teal with racing stripes */
.topbar.felt { background: var(--felt); box-shadow: none; }
.topbar h1 { font-weight: 600; font-size: 24px; }
.brassline { height: 10px; opacity: 1; background: linear-gradient(var(--mustard) 0 33%, var(--tomato) 33% 66%, var(--outline) 66%); }

/* Home: title band, then the game-box lid art as a banner */
header.felt:has(.hero) { background: var(--felt); }
.hero { padding-top: 26px; padding-bottom: 20px; }
.hero .brand { font-size: 46px; font-weight: 700; line-height: 1; letter-spacing: .5px; text-shadow: 3px 3px 0 var(--outline); }
.hero .tag { font-size: 17px; font-weight: 700; color: var(--on-felt-2); margin-top: 10px; }
header.felt:has(.hero) .brassline { height: 172px; background: var(--art-hero) 40% 45% / cover; border-top: 5px solid var(--mustard); border-bottom: 5px solid var(--outline); }

h2.sec { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
h2.sec::before { content: ""; width: 28px; height: 28px; background: var(--art-heart) center / contain no-repeat; transform: rotate(-8deg); }

/* Sticker cards */
.card, .gametile { border: 2px solid var(--outline); box-shadow: var(--shadow); }
.gametile { border-radius: 18px; }
.gametile:hover { border-color: var(--outline); transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--outline); }
.gametile .gi { width: 60px; height: 60px; border-radius: 0; background: none; border: 0; margin: -4px 0 0 -4px; }
.gametile b { font-size: 20px; font-weight: 600; }

.btn { border: 2px solid var(--outline); border-radius: 14px; font-weight: 700; box-shadow: 3px 3px 0 var(--outline); }
.btn.primary { background: #b3391b; border-color: var(--outline); color: #fff6e4; box-shadow: 3px 3px 0 var(--outline); }
.btn.primary:active, .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--outline); }
.chip { border-width: 2px; }
.chip[aria-pressed="true"], .seg button[aria-pressed="true"] { background: var(--felt); border-color: var(--outline); }

/* Scoreboard */
.tot { border-top-width: 8px; border-top-color: var(--c); }
.tot .big { font-size: 54px; font-weight: 600; }
.tot.lead { border-color: var(--outline); border-top-color: var(--c); box-shadow: 5px 5px 0 var(--mustard), 5px 5px 0 2px var(--outline); }
.leadtag { background: var(--mustard); color: var(--outline); border: 2px solid var(--outline); }
.progress { border: 1.5px solid var(--outline); height: 9px; }
.hist th { font-weight: 700; }

/* Cribbage board: mustard painted board, charcoal holes */
.board { background: linear-gradient(160deg, #f0b841, #dc9820); border: 2px solid var(--outline); box-shadow: var(--shadow); }
.board svg circle[fill="#4a2f14"] { fill: #26282c; opacity: .8; }
.board svg text { fill: #26282c; }
.pegrow button { border: 2px solid var(--outline); border-bottom: 5px solid var(--c); }

/* Winner: prize ribbon with confetti */
header.felt:has(.winner) {
  background:
    radial-gradient(circle, var(--mustard) 0 3px, transparent 3.5px) 12px 20px / 64px 58px,
    radial-gradient(circle, var(--tomato) 0 2.5px, transparent 3px) 40px 44px / 76px 64px,
    radial-gradient(circle, #fff6e4 0 2px, transparent 2.5px) 22px 8px / 52px 70px,
    var(--felt);
}
.winner { padding-top: 30px; }
.winner .laurel { display: none; }
.winner::before {
  content: ""; display: block; width: 210px; height: 210px; margin: 0 auto 6px;
  background: var(--art-winner) center 42% / cover;
  -webkit-mask-image: radial-gradient(circle, #000 55%, transparent 71%); mask-image: radial-gradient(circle, #000 55%, transparent 71%);
}
.winner .lbl { display: inline-block; background: var(--mustard); color: var(--outline); padding: 3px 14px; border: 2px solid var(--outline); border-radius: 999px; }
.winner .who { font-size: 54px; font-weight: 700; text-shadow: 3px 3px 0 var(--outline); }
.final .s { font-size: 36px; font-weight: 600; }

.badge { display: block; width: 100%; height: 100%; background: center / contain no-repeat; }
.badge svg { display: none; }
.g-handfoot { background-image: var(--badge-handfoot); }
.g-canasta { background-image: var(--badge-canasta); }
.g-spades { background-image: var(--badge-spades); }
.g-gin { background-image: var(--badge-gin); }
.g-rum500 { background-image: var(--badge-rum500); }
.g-mextrain { background-image: var(--badge-mextrain); }
.g-cribbage { background-image: var(--badge-cribbage); }
.g-euchre { background-image: var(--badge-euchre); }
/* Chassis layer (v1.0.0): safe areas on every edge, About sheet, toast, rating card. */
.wrap { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
.sheet { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); max-height: 88dvh; }
a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; color: inherit; }
a.btn.block { display: flex; }
.about h3 { font-family: var(--serif); font-size: 18px; margin: 18px 0 6px; }
.about p { margin: 0 0 8px; line-height: 1.5; }
.about .about-lead { font-size: 16px; }
.about .about-lead b { font-family: var(--serif); font-size: 20px; }
.about a.linkbtn { display: inline-flex; align-items: center; min-height: 44px; }
.about .version { margin-top: 18px; text-align: center; font-weight: 700; color: var(--ink-2); font-size: 14px; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 80;
  max-width: min(92vw, 460px); background: var(--felt-deep); color: var(--on-felt); border: 2px solid var(--outline);
  border-radius: 14px; padding: 12px 16px; font-weight: 700; box-shadow: 3px 3px 0 var(--mustard); text-align: center;
  animation: cn-toast .25s ease-out;
}
@keyframes cn-toast { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
.reviewcard { background: var(--surface); border-top: 8px solid var(--mustard); margin-top: 6px; }
.reviewcard .rv-title { font-family: var(--serif); font-size: 20px; display: block; }
.reviewcard .rv-stars { display: inline-flex; gap: 2px; color: var(--mustard); }
.reviewcard .rv-stars svg { width: 22px; height: 22px; stroke: var(--outline); stroke-width: 1.2px; }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
/* Home title stays on one line with three header buttons: full size from 412px up, gently smaller below. */
.hero .brand { white-space: nowrap; font-size: min(46px, calc((100vw - 172px) * .2018)); }
.hero > div:first-child { min-width: 0; padding-right: 6px; }
/* v1.0.1: Mexican Train engine badge (AA contrast in both themes) */
.enginebadge { flex: 0 0 auto; width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: var(--felt); color: var(--on-felt); border: 2px solid var(--outline); box-shadow: 2px 2px 0 var(--outline); font-family: var(--serif); font-weight: 700; font-size: 24px; }
/* v1.0.1: wide score tables keep the round number in view and show a shadow where more columns wait */
.histscroll { overflow-x: auto; -webkit-overflow-scrolling: touch;
  background:
    linear-gradient(to left, var(--surface) 30%, rgba(255, 255, 255, 0)) right center / 36px 100% no-repeat local,
    radial-gradient(farthest-side at 100% 50%, rgba(0, 0, 0, .28), rgba(0, 0, 0, 0)) right center / 16px 100% no-repeat scroll,
    var(--surface); }
.hist th:first-child, .hist td:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface); box-shadow: 1px 0 0 var(--line); }
.histhint { font-size: 13px; color: var(--ink-2); margin: 6px 2px 0; }
/* v1.0.1: 6 to 8 players fit a phone-width table; longer names still scroll with the cue */
.hist.dense th, .hist.dense td { padding: 0 3px; font-size: 13px; }
.hist.dense th { font-size: 11px; letter-spacing: -.1px; }
.hist.dense th:first-child, .hist.dense td:first-child { padding-left: 8px; width: 22px; }
.hist.dense td:last-child, .hist.dense th:last-child { padding-right: 8px; }
.hist.dense .cum { font-size: 11px; }
/* v1.0.2: on-screen picture or backup text when a file cannot be shared or downloaded */
.fileview-img { display: block; width: 100%; height: auto; border-radius: 12px; border: 2px solid var(--outline); -webkit-touch-callout: default; user-select: auto; }
.fileview-text { width: 100%; min-height: 180px; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; resize: vertical; }
/* v1.0.3: printable score sheet buttons in Settings and help */
.printgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.printgrid .btn { min-height: 44px; padding: 8px 6px; font-size: 15px; }
/* v1.0.4: centered, balanced text everywhere in the app (lists stay left-aligned inside a centered block for reading) */
.gametile { align-items: center; text-align: center; }
.gametile .gi { margin: -4px auto 0; }
.status, .warn, .small.muted, p.muted, .histhint, .reviewcard, .final + p { text-align: center; }
.about h3, .about p, .about .version, .printbox, .printbox h3 { text-align: center; }
.about h3 { font-size: 19px; }
.about ol.rules, .sheet ul.rules { max-width: 34em; margin-left: auto; margin-right: auto; text-align: left; }
.sheet > h3 { text-align: center; }
.printbox { margin-top: 18px; padding-top: 14px; border-top: 2px dashed var(--line); }
.printbox h3 { font-family: var(--serif); font-size: 19px; margin: 0 0 4px; }
.printbox p { margin: 0 0 10px; }
.printpick { display: grid; gap: 10px; max-width: 360px; margin: 0 auto; }
.printpick select { min-height: 48px; text-align: center; text-align-last: center; }
.about .opt { text-align: left; }
.about .btnrow { justify-content: center; }
.btn { text-align: center; }
.winner, .winner .lbl { text-align: center; }
/* v1.0.4: home header centered; tool buttons in their own row */
.hero.herocenter { display: block; text-align: center; padding-top: 6px; }
.herotools { display: flex; justify-content: flex-end; margin: 0 -8px 2px 0; }
.hero.herocenter .brand { font-size: min(46px, calc((100vw - 32px) * .2)); white-space: nowrap; }
.hero.herocenter > div:first-child { padding-right: 0; }
.hero.herocenter .tag { max-width: 24em; margin-left: auto; margin-right: auto; }
/* v1.0.4: 8 games sit in balanced rows: 2 columns on phones, 4 on tablets and computers */
@media (min-width: 620px) { .gamegrid { grid-template-columns: repeat(4, 1fr); } }
h2.sec { justify-content: center; }
</style>
